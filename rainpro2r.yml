trainer:
  precision: '32'
  gradient_clip_val: 1.0
  max_epochs: 20
  log_every_n_steps: 50
  project: rainpro_sevir
  early_stopping_patience: 5
  devices: [0]

model:
  class_path: rainpro.modules.sevir.SEVIRModule

data:
  # data_root: # Add path to SEVIR dataset
  frames_in: 5
  frames_out: 20
  img_size: 128
  stride: 5
  batch_size: 6
  eval_batch_size: 12
  num_workers: 16