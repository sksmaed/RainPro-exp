[project]
name = "rainpro"
version = "0.1.0"
description = "Official implementation of RainPro-8"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2024.1.0",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "ipykernel>=6.29.5",
    "jsonargparse[signatures]>=4.27.7",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "scipy>=1.13",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "wandb[media]>=0.25.1",
    "xarray>=2024.1.0",
    "zarr>=3.0", # zarr v3 python API (zarr.storage.LocalStore, zarr.codecs.*,
    # zarr_format=3) is required by scripts/compress_sta_h8_taiwan.py, and
    # already implicitly relied on to read the existing QPESUMS zarr v2 store
    # read-only (zarr-python 3.x supports both v2 and v3 stores; 2.x does not
    # support v3 at all) -- was ">=2.17" before, which permitted this anyway
    # but didn't say so explicitly.
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]
torchvision = [
  { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
