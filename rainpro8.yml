# RainPro-8 (Taiwan): QPESUMS + STA_H8 obs-only baseline, with GFS available
# as an optional input behind `--data.include_gfs` -- see
# rainpro/data/rainpro8_sources.py.
#
# Usage:
#   python main_rainpro8.py fit <run_name> --config rainpro8.yml \
#       --data.data_root '{"qpesums": <path>, "sta_h8": <path>}'
#
# NOTE: `data_root` is a plain `dict[str, str]`, not a nested config class, so
# jsonargparse does *not* support per-key dotted overrides like
# `--data.data_root.qpesums <path>` -- that silently resets the whole dict to
# `None` instead of merging. Always pass the full dict as one JSON string.
#
# To include GFS, add `--data.include_gfs true --data.data_root
# '{"qpesums": <path>, "sta_h8": <path>, "gfs": <path>, "gfs_forecast": <path>}'`.
# `data.gfs_variables` defaults to the paper's 122-channel App. I selection
# (`GFS_ANALYSIS_VARIABLES` in rainpro/data/rainpro8_sources.py); pass
# `--data.gfs_variables [...]` only to override it, and
# `--data.variable_aliases {...}` if the real GFS zarr store names fields
# differently than those canonical names.
#
# For a radar-only ablation arm, add `--data.include_satellite false` (QPESUMS
# stays; only STA_H8 drops out -- `data_root.sta_h8` becomes unused).
#
# `data_root.sta_h8` accepts EITHER the raw STA_H8 directory (slow: full
# 2750x2750 per-file reads off a shared filesystem, no caching -- see
# rainpro/data/sta_h8_raw.py) OR the path to a zarr v3 store produced by
# `scripts/compress_sta_h8_taiwan.py` (cropped to the region this config
# actually trains on and compressed; auto-detected via a `zarr.json` at that
# path by `RainPro8Dataset._get_store`) -- point it at the converted store
# once you've run that script. See job-375131.{out,err} / that script's
# docstring for why the raw path was the actual training-speed bottleneck,
# not multi-GPU utilization.

trainer:
  precision: '32'
  gradient_clip_val: 1.0
  max_epochs: 50 # paper trains for 100k steps (batch_size=16); tune to your dataset size
  log_every_n_steps: 50
  project: rainpro8_tw
  devices: [0]
  num_animations: 20

model:
  class_path: rainpro.modules.rainpro8.RainPro8Module
  init_args:
    lead_time_decay_ratio: 10.0
    learning_rate: 3.0e-4
    weight_decay: 0.1
    dropout: 0.1
    stochastic_depth_prob: 0.2

data:
  include_satellite: true # set false to drop STA_H8 for a radar-only (QPESUMS-only) ablation arm
  include_gfs: false # set true (+ data_root.gfs / gfs_forecast) to add GFS as a 16km-tier input
  # jsonargparse deep-merges dict-typed params across config/CLI sources, so a
  # placeholder key set to a blank (null) value here would survive a CLI
  # override that only touches other keys, then fail `dict[str, str]`
  # validation (null isn't str) -- see the NOTE above. Keep this empty and
  # always pass the full set of keys you need via `--data.data_root '{...}'`:
  # qpesums (QPESUMS zarr, max dBZ), sta_h8 (STA_H8 zarr, 9 IR bands; only
  # when include_satellite=true), gfs / gfs_forecast (only when include_gfs=true).
  data_root: {}
  # Full 2021 (QPESUMS covers it; STA_H8's real archive only spans late-Feb
  # through late-Dec 2021 -- `RainPro8DataModule.setup()` drops any init_time
  # without satellite coverage from every split when include_satellite=true,
  # so the missing Jan/Feb stretch and other gaps are excluded automatically
  # rather than training on all-fill_value satellite input).
  start_date: 2021-01-01
  end_date: 2022-01-01
  # 17:1:2 day cycle == 85/5/10 train/val/test, repeated through the year so
  # no single split is skewed toward one season (paper Sec. A.3 rationale).
  cycle_train_days: 17
  cycle_val_days: 1
  cycle_test_days: 2
  cycle_blackout_hours: 12
  center_lat: 23.7
  center_lon: 121.0
  train_jitter_km: 256
  batch_size: 16
  eval_batch_size: 16
  # job-375131 ran this at num_workers=16 with `trainer.devices` overridden to
  # 8 GPUs on the CLI -- that's 16*8=128 DataLoader worker *processes* on one
  # node, which on most HPC nodes oversubscribes the CPU (check `nproc`) and,
  # combined with every worker hitting the same shared STA_H8 filesystem, was
  # the actual cause of the periodic ~80s-per-4-steps stalls in that run, not
  # GPU compute. Lowered to 8 (8 GPUs * 8 = 64 total) as a safer default --
  # tune to roughly (node CPU cores) / (GPUs per node), and lower further if
  # you still see stalls after converting STA_H8 via
  # scripts/compress_sta_h8_taiwan.py.
  num_workers: 8
  persistent_workers: true # keep worker processes (+ their open store handles /
  # regridder KDTrees / RainPro8Dataset._frame_cache) alive across epochs
  # instead of re-forking (and, on the raw STA_H8 fallback path, re-walking
  # the whole source tree) every single epoch.
  prefetch_factor: 4
  frame_cache_size: 64 # per-worker LRU cache of raw (pre-regrid) source frames,
  # keyed by (store, variable, resolved timestamp) -- dedupes repeat reads of
  # the same underlying frame across samples whose offset windows overlap
  # (e.g. satellite_8km's hourly frames, shared by every 10-min target sample
  # within that hour). Raise if you have RAM to spare and see cache misses
  # dominating; each entry is one (H, W) float32 source-resolution frame.
